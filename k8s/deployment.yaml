apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-allocation-service
  namespace: pexip
  labels:
    app: call-allocation-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: call-allocation-service
  template:
    metadata:
      labels:
        app: call-allocation-service
    spec:
      containers:
        - name: call-allocation-service
          image: callallocationservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
